# Los proyectos gratuitos de Supabase se pausan tras 7 días sin actividad.
# Esta consulta diaria lo mantiene activo. Requiere los secrets SUPABASE_URL y SUPABASE_ANON_KEY.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Sin secrets configurados; nada que hacer."; exit 0; fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/portal_info" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}'
